# macOS overrides, loaded last by kitty.conf via `include ${KITTY_OS}.conf`.

font_family      JetBrainsMono Nerd Font Mono

# Cmd instead of Ctrl, matching macOS conventions
kitty_mod super+shift

map super+f1 launch --cwd=current
map super+f2 detach_tab
map super+f4 launch --location=split
map super+f5 launch --location=hsplit
map super+f6 launch --location=vsplit
map super+f7 layout_action rotate

editor /opt/homebrew/bin/nvim
